spring:
  datasource:
    url: jdbc:mysql://localhost:3306/riceleaf?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql

app:
  detect:
    cloud-endpoint: "http://localhost:5000/detect"
